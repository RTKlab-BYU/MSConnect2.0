# Standalone DIA-NN worker for an existing MSConnect API (including Tailscale).
services:
  processor-diann:
    image: ${MSCONNECT_DIANN_IMAGE:-msconnect-processor-diann:2.2.0-standalone-r2}
    build:
      context: .
      dockerfile: docker/processor/diann.Dockerfile
      args:
        DIANN_LINUX_URL: ${DIANN_LINUX_URL:-}
        DIANN_SOURCE_IMAGE: ${DIANN_SOURCE_IMAGE:-download}
        DOTNET_SDK_IMAGE: ${DOTNET_SDK_IMAGE:-mcr.microsoft.com/dotnet/sdk:8.0-bookworm-slim}
        DIANN_VERSION: ${DIANN_ENGINE_VERSION:-2.2.0}
    restart: unless-stopped
    environment:
      MSCONNECT_API_BASE_URL: ${MSCONNECT_API_BASE_URL:?Set the remote API URL ending in /api}
      MSCONNECT_AGENT_TOKEN: ${MSCONNECT_PROCESSOR_TOKEN:?Set the remote processor token}
      MSCONNECT_AGENT_NAME: ${DIANN_AGENT_NAME:-diann-remote-1}
      MSCONNECT_PROCESSOR_ENGINE: diann
      MSCONNECT_PROCESSOR_ENGINE_VERSION: ${DIANN_ENGINE_VERSION:-2.2.0}
      MSCONNECT_PROCESSOR_ENGINE_PROFILE: ${DIANN_ENGINE_PROFILE:-diann:2.2.0}
      MSCONNECT_IMAGE: ${MSCONNECT_DIANN_IMAGE:-msconnect-processor-diann:2.2.0-standalone-r2}
      RAW_FILE_STORAGE_ROOT: /data/raw
      RESULTS_ROOT: /data/results
      PROCESSOR_SHARED_STORAGE_ROOT: /data/shared
    volumes:
      - ${RAW_STORAGE_HOST_PATH:?Mount the remote raw storage first}:/data/raw:ro
      - ${RESULTS_HOST_PATH:?Mount the remote results storage first}:/data/results
      - ${PROCESSOR_SHARED_HOST_PATH:?Mount the remote reference storage first}:/data/shared:ro
