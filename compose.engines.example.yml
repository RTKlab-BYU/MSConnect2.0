services:
  processor-diann-2-0:
    image: ${MSCONNECT_DIANN_2_0_IMAGE:-registry.example.org/msconnect/processor-diann:2.0}
    command: >
      sh -c "python manage.py run_processor_agent"
    env_file:
      - path: .env
        required: false
    environment:
      MSCONNECT_AGENT_TOKEN: ${MSCONNECT_PROCESSOR_TOKEN:-processor-token}
      MSCONNECT_AGENT_NAME: ${DIANN_2_0_AGENT_NAME:-diann-2-0-01}
      MSCONNECT_PROCESSOR_ENGINE: diann
      MSCONNECT_PROCESSOR_ENGINE_VERSION: "2.0"
      MSCONNECT_PROCESSOR_ENGINE_PROFILE: diann:2.0
      MSCONNECT_IMAGE: ${MSCONNECT_DIANN_2_0_IMAGE:-registry.example.org/msconnect/processor-diann:2.0}
    volumes:
      - ${MSCONNECT_DATA_HOST_PATH:-./data}:/app/data
      - ${RAW_STORAGE_HOST_PATH:-./raw-storage}:/data/raw
      - ${RESULTS_HOST_PATH:-./results}:/data/results
      - ${PROCESSOR_SHARED_HOST_PATH:-./shared}:/data/shared

